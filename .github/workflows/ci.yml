# CI for xVora (KaiyoDev/xVora)
#
# Priority gates (all hard-fail):
#   1. fmt          — ubuntu, fast feedback
#   2. check        — windows: cargo check on ship package (no build scripts)
#   3. build        — windows: release binary + artifact (xvora-win-x64)
#
# No GitHub Release yet — download from Actions artifacts.
# concurrency: only the newest run per ref stays alive.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "changelogs/**"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  # ── 1. Format (cheap, early) ───────────────────────────────────────────
  lint:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - run: cargo fmt --all -- --check

  # ── 2. Check + Test (windows, no full build) ───────────────────────────
  check:
    name: check + test
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PROTOC absolute path
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          Write-Host "protoc = $protoc"
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xvora-check-windows-v1
          cache-on-failure: true

      - name: cargo check -p xvora-pager-bin
        env:
          PROTOC: ${{ env.PROTOC }}
        run: cargo check -p xvora-pager-bin

      - name: cargo test -p xvora-env --lib
        env:
          PROTOC: ${{ env.PROTOC }}
        run: cargo test -p xvora-env --lib

      - name: cargo test -p xvora-shell --lib agent::config::tests
        env:
          PROTOC: ${{ env.PROTOC }}
        run: cargo test -p xvora-shell --lib agent::config::tests

      - name: cargo clippy -p xvora-pager-bin
        env:
          PROTOC: ${{ env.PROTOC }}
        run: cargo clippy -p xvora-pager-bin -- -D warnings

  # ── 3. Release build + artifact (windows) ──────────────────────────────
  build:
    name: build (release)
    needs: [check]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PROTOC absolute path
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          Write-Host "protoc = $protoc"
          & $protoc --version
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xvora-release-windows-v4
          cache-on-failure: true

      - name: cargo build --release -p xvora-pager-bin
        env:
          PROTOC: ${{ env.PROTOC }}
          RUSTFLAGS: "-C force-unwind-tables=yes -C target-feature=+crt-static -C link-arg=/DEBUG:NONE"
        run: cargo build -p xvora-pager-bin --release

      - name: Smoke test binary
        run: |
          $bin = "target\release\xvora.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          & $bin --version
          Get-Item $bin | Format-List Name, Length, FullName

      - name: Upload xvora Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: xvora-win-x64
          path: target/release/xvora.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  # Keep only the newest completed run history for this workflow file.
  cleanup-old-runs:
    name: cleanup old runs
    needs: [build]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs (keep latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          echo "Keeping run id: $KEEP_RUN_ID"

          mapfile -t IDS < <(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${KEEP_RUN_ID}) | .id" \
              | head -n 50
          )

          if [[ ${#IDS[@]} -eq 0 ]]; then
            echo "No older completed runs to delete."
            exit 0
          fi

          echo "Deleting ${#IDS[@]} older run(s)..."
          for id in "${IDS[@]}"; do
            echo "  delete run $id"
            gh api -X DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/runs/${id}" \
              || echo "  (skip $id — may already be gone)"
          done

          echo "Done."
