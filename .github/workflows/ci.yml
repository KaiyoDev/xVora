# CI for xVora (KaiyoDev/xVora)
#
# Priority gates (all hard-fail):
#   1. fmt          — ubuntu, fast feedback
#   2. unit subset  — windows: env + shell provider/auth tests
#   3. check/clippy — windows: type/API on ship package
#   4. release bin  — windows: xvora.exe artifact (xvora-win-x64)
#
# No GitHub Release yet — download from Actions artifacts.
# concurrency: only the newest run per ref stays alive.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Skip full CI when the PR only touches docs (saves ~1–3h Windows minutes).
    paths-ignore:
      - "**.md"
      - "changelogs/**"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin matches rust-toolchain.toml
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  # ── 1. Format (cheap, early) ───────────────────────────────────────────
  lint:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── 2–4. Windows: tests + check/clippy + release binary ────────────────
  build:
    name: test + check + build (windows)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PROTOC absolute path
        shell: pwsh
        run: |
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          Write-Host "protoc = $protoc"
          & $protoc --version
          # Force build scripts off repo bin/protoc (dotslash, not Win32).
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # bump when release RUSTFLAGS / key packages change
          shared-key: xvora-pager-bin-windows-v4
          cache-on-failure: true

      # ── unit subset (auth / multi-provider / env) ─────────────────────
      - name: cargo test -p xvora-env --lib
        shell: pwsh
        env:
          PROTOC: ${{ env.PROTOC }}
        run: cargo test -p xvora-env --lib

      - name: cargo test -p xvora-shell (config / provider / credentials)
        shell: pwsh
        env:
          PROTOC: ${{ env.PROTOC }}
        # Full shell suite is 5k+ tests — gate the multi-provider + credentials module.
        # Filter is a single substring (cargo accepts one TESTNAME before --).
        run: cargo test -p xvora-shell --lib agent::config::tests

      # ── type/API gate on ship package ────────────────────────────────
      - name: cargo check -p xvora-pager-bin
        shell: pwsh
        env:
          PROTOC: ${{ env.PROTOC }}
        run: cargo check -p xvora-pager-bin

      - name: cargo clippy -p xvora-pager-bin
        shell: pwsh
        env:
          PROTOC: ${{ env.PROTOC }}
        # Hard-fail (no continue-on-error) — catches API/lint drift before release link.
        run: cargo clippy -p xvora-pager-bin -- -D warnings

      # ── ship binary ──────────────────────────────────────────────────
      - name: cargo build --release -p xvora-pager-bin
        shell: pwsh
        env:
          PROTOC: ${{ env.PROTOC }}
          # MSVC link.exe hits LNK4319 (PDB public-symbol limit) on this monorepo.
          # rustc always passes /DEBUG for .natvis even with release debug=0.
          # Artifact is xvora.exe only — no PDB. RUSTFLAGS replaces target
          # rustflags from .cargo/config.toml, so restate the Windows flags.
          RUSTFLAGS: "-C force-unwind-tables=yes -C target-feature=+crt-static -C link-arg=/DEBUG:NONE"
        run: cargo build -p xvora-pager-bin --release

      - name: Smoke test binary
        shell: pwsh
        run: |
          $bin = "target\release\xvora-pager.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          & $bin --version
          Get-Item $bin | Format-List Name, Length, FullName

      - name: Upload xvora Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: xvora-win-x64
          path: target/release/xvora-pager.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  # Keep only the newest completed run history for this workflow file.
  cleanup-old-runs:
    name: cleanup old runs
    needs: [build]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs (keep latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          echo "Keeping run id: $KEEP_RUN_ID"

          mapfile -t IDS < <(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${KEEP_RUN_ID}) | .id" \
              | head -n 50
          )

          if [[ ${#IDS[@]} -eq 0 ]]; then
            echo "No older completed runs to delete."
            exit 0
          fi

          echo "Deleting ${#IDS[@]} older run(s)..."
          for id in "${IDS[@]}"; do
            echo "  delete run $id"
            gh api -X DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/runs/${id}" \
              || echo "  (skip $id — may already be gone)"
          done

          echo "Done."
