[package]
license = "Apache-2.0"
name = "xvora-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
xvora-hooks = { path = "../xvora-hooks" }
xvora-sampling-types = { path = "../xvora-sampling-types" }
xvora-tools = { path = "../xvora-tools" }
xvora-tty-utils = { workspace = true, package = "xvora-tty-utils" }
token-estimation = { workspace = true, package = "xvora-token-estimation" }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
xvora-config = { workspace = true }
xvora-dirs = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
xvora-tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
