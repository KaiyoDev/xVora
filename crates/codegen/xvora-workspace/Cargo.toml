[package]
license = "Apache-2.0"
name = "xvora-workspace"
version = "0.1.220-alpha.4"
edition.workspace = true
description = "Core host-local workspace library (FS, VCS, execution, discovery) for xvora-shell and remote sampler"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
dunce = { workspace = true }
version = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
parking_lot = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
agent = { path = "../xvora-agent", package = "xvora-agent" }
tools = { path = "../xvora-tools", package = "xvora-tools" }
tools-api = { path = "../xvora-tools-api", package = "xvora-tools-api" }
# `DiagHandle`, held by the hub config and threaded through `connect_hub`.
diag-server = { workspace = true }
workspace-client = { path = "../xvora-workspace-client", package = "xvora-workspace-client" }
# Daemon/process-lifecycle machinery for `bin/workspace_server.rs` only; the
# library never references it.
workspace-daemon = { path = "../xvora-workspace-daemon", package = "xvora-workspace-daemon" }
workspace-types = { path = "../xvora-workspace-types", package = "xvora-workspace-types" }
config = { workspace = true }
dirs = { workspace = true }
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
config-types = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
dashmap = { workspace = true }
agent-client-protocol = { workspace = true }
acp-lib = { workspace = true }
codebase-graph = { path = "../codebase-graph", package = "xvora-codebase-graph" }
paths = { path = "../xvora-paths", package = "xvora-paths" }
base64 = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true, features = ["force-soft"] }
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
# Backs `file_system`'s fuzzy path picker (matcher + background daemon).
fuzzy-file-search = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
chrono = { workspace = true }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
url = { workspace = true }
env = { workspace = true }
humantime-serde = { workspace = true }
prometheus = { workspace = true }
glob = "0.3"
sandbox = { path = "../xvora-sandbox", package = "xvora-sandbox", default-features = false }
hooks = { path = "../xvora-hooks", package = "xvora-hooks" }
hunk-tracker = { path = "../hunk-tracker", package = "xvora-hunk-tracker" }
# `metrics` enables the SDK's metric-donation client (periodic Prometheus
# registry gather → OTLP → hub donation pump); see metric_donation_reporter.
computer-hub-sdk = { workspace = true, features = ["metrics"] }
computer-hub-mcp-adapter = { path = "../../common/computer-hub-mcp-adapter", package = "xvora-computer-hub-mcp-adapter" }
mcp = { path = "../xvora-mcp", package = "xvora-mcp" }
file-utils = { path = "../file-utils", package = "xvora-file-utils" }
session-events = { workspace = true }
auth = { path = "../xvora-auth", package = "xvora-auth" }
telemetry = { workspace = true }
tty-utils = { workspace = true }
reqwest = { workspace = true }
tool-protocol = { workspace = true }
tool-runtime = { workspace = true }
tool-types = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
urlencoding = "2"
fast-worktree = { path = "../fast-worktree", package = "xvora-fast-worktree", features = ["metadata"] }
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = { workspace = true }
sha1 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

fsnotify = { path = "../xvora-fsnotify", package = "xvora-fsnotify" }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# "enable" required for the SDK's spans to record at all.
fastrace = { workspace = true, features = ["enable"] }
# tracing = { workspace = true }
extra-ca = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tempfile = { workspace = true }
zstd = { workspace = true }
wait-timeout = { workspace = true }

# Raw fd/dirent/poll calls in foreign-session capability probes, the fuzzy
# walker's rlimit guard, and the envrc reader.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[[bin]]
name = "xvora-workspace-server"
path = "src/bin/workspace_server.rs"

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
test-util = []
sandbox-enforce = ["sandbox/enforce"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
test-utils = { path = "../../common/test-utils", package = "xvora-test-utils" }
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = { workspace = true }
tar = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
