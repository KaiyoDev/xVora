[package]
license = "Apache-2.0"
name = "xvora-workspace-client"
version = "0.1.0"
edition.workspace = true
description = "Lightweight typed client for hub-proxied workspace.* RPCs (shared by xvora-shell proxy mode and other consumers)"

[dependencies]
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
xvora-computer-hub-sdk = { workspace = true, package = "xvora-computer-hub-sdk" }
xvora-workspace-types = { workspace = true }
xvora-tool-protocol = { workspace = true, package = "xvora-tool-protocol" }
xvora-tool-runtime = { workspace = true, package = "xvora-tool-runtime" }

[features]
default = []
default-bazel = []
[dev-dependencies]
schemars = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
xvora-tool-types = { workspace = true, package = "xvora-tool-types" }

[lints]
workspace = true
