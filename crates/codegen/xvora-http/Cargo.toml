[package]
license = "Apache-2.0"
name = "xvora-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
xvora-auth = { workspace = true, features = ["middleware"] }
extra-ca = { workspace = true }
xvora-sampler = { path = "../xvora-sampler" }
xvora-telemetry = { workspace = true }
xvora-version = { workspace = true }
xvora-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
