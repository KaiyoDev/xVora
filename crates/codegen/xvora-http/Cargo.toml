[package]
license = "Apache-2.0"
name = "xvora-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the Xvora CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
xvora-auth = { workspace = true, features = ["middleware"] }
xvora-sampler = { path = "../xvora-sampler" }
xvora-telemetry = { workspace = true }
xvora-version = { workspace = true }
xvora-workspace = { workspace = true }

[lints]
workspace = true
