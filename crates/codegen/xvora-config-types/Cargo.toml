[package]
license = "Apache-2.0"
name = "xvora-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the Xvora CLI, extracted from xvora-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
xvora-announcements = { workspace = true }
xvora-config = { workspace = true }
xvora-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
